# PD 分离示例的模型、负载与服务参数
#
# 与 serving_cast/example/common.yaml 结构完全一致，差异仅在负载规模与请求速率，
# 以便该示例在标准开发环境下用较短时间跑完一次完整仿真。
model_config:
  name: Qwen/Qwen3-32B              # 模型标识，首次运行需从 HuggingFace / ModelScope 拉取 config.json
  num_mtp_tokens: 0                 # MTP（多 token 预测）投机 token 数，0 表示关闭
  quantize_linear_action: W8A8_DYNAMIC
  quantize_lmhead: False
  mxfp4_group_size: 32
  quantize_attention_action: DISABLED
  do_compile: False                 # 是否走图编译路径，示例场景保持 False
  allow_graph_break: False
  dump_input_shapes: False
  chrome_trace: null
  enable_multi_process: False       # 是否用多进程加速性能预测
  num_processes: 10
  predict_steps: 5                  # 插值采样点数量，越大越精确、预热越慢
  enable_interpolate: True          # 开启插值，避免逐 step 实测，显著缩短仿真时间
  interpolation_seed: 1234          # 插值采样随机种子，固定后结果可复现
  enable_preprocessing_modeling: True
  enable_kv_transfer_modeling: True # PD 分离必须开启，否则 Prefill -> Decode 的 KV 传输时延按 0 计算

load_gen:
  load_gen_type: fixed_length       # 定长负载生成器
  num_requests: 32                  # 请求总数，调大可让统计更平稳，同时线性拉长仿真时间
  num_input_tokens: 512             # 单请求输入长度，主要影响 Prefill 池压力与 TTFT
  num_output_tokens: 128            # 单请求输出长度，主要影响 Decode 池压力与 TPOT
  request_rate: 4.0                 # 请求到达速率（req/s），泊松到达

serving_config:
  max_concurrency: 8                # 全局在服并发上限，超过后新请求排队（同时决定预热采样批数）
  block_size: 128                   # KV Cache 分页大小（token / block）
  max_tokens_budget: 1024           # 单次调度批的 token 预算上限（同时决定预热采样批数）
