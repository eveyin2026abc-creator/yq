# Package ######################################################################

[project]
name = "liuren_modeling"
version = "0.1.0"
description = "Light-weight full-system simulation framework"
readme = "README.md"
version = "0.1.0"
requires-python = ">=3.9"

[build-system]
requires = ["setuptools>=61.2"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["tensor_cast*", "cli*", "serving_cast*", "web_ui*"]

# Test tools ###################################################################

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "npu: mark test as requiring NPU hardware (torch_npu + physical device)",
]
addopts = "-m 'not npu'"

# Coverage #####################################################################

[tool.coverage.run]
branch = true
omit = [
    "*/test_*.py",
    "*/tests/*",
    "*/__pycache__/*",
    "*/.pytest_cache/*",
    "*/builtin_model/*"
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "@abstractmethod",
    "raise NotImplementedError",
]
