<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>msmodeling 流水日历</title>
  <style>
    :root {
      --ink: #1c1915;
      --muted: #6b645b;
      --line: #e4ddd2;
      --paper: #f6f3ee;
      --card: #fffdf9;
      --pass: #1f7a4d;
      --fail: #b42318;
      --timeout: #9a6700;
      --empty: #d9d3ca;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
    }
    header, main { max-width: 1180px; margin: 0 auto; padding: 28px 24px; }
    header { padding-bottom: 0; }
    h1 { font-size: 28px; font-weight: 650; margin: 0 0 6px; letter-spacing: -0.02em; }
    p.lead { margin: 0; color: var(--muted); }
    .freshness { margin-top: 10px; padding: 9px 12px; border-radius: 9px; font-size: 13px; }
    .freshness.fresh { background: #e7f6ee; color: #145c38; }
    .freshness.stale { background: #fff3cd; color: #713f12; border-left: 5px solid #d97706; }
    main { display: grid; grid-template-columns: 420px 1fr; gap: 22px; align-items: start; }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
    }
    .cal-head, .detail-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    button {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      padding: 6px 10px;
      cursor: pointer;
      color: var(--ink);
    }
    button:hover { border-color: #c8bfb2; }
    .week, .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .week { margin: 14px 0 8px; color: var(--muted); font-size: 12px; text-align: center; }
    .day {
      min-height: 64px;
      border-radius: 10px;
      border: 1px solid transparent;
      background: #f3efe8;
      padding: 8px;
      text-align: left;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .day.empty-cell { visibility: hidden; }
    .day.pass { background: #e7f6ee; color: var(--pass); }
    .day.fail { background: #fdecea; color: var(--fail); }
    .day.timeout { background: #fff6e0; color: var(--timeout); }
    .day.none { background: #f3efe8; color: #8a837a; }
    .day.selected { outline: 2px solid var(--ink); }
    .day.today { box-shadow: inset 0 0 0 1px var(--ink); }
    .num { font-weight: 650; }
    .mark { font-size: 11px; }
    .legend { display: flex; gap: 12px; margin-top: 14px; color: var(--muted); font-size: 12px; }
    .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 12px 0 4px; }
    .summary span { padding: 8px; border-radius: 8px; background: #f3efe8; text-align: center; font-size: 12px; }
    .summary strong { display: block; font-size: 17px; color: var(--ink); }
    .sync-warning { margin: 8px 0; padding: 8px 10px; border-radius: 8px; background: #fff3cd; color: #713f12; font-size: 12px; }
    .swatch { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }
    h2 { margin: 0; font-size: 22px; }
    .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .run { border-top: 1px solid var(--line); margin-top: 16px; padding-top: 16px; }
    .run:first-of-type { border-top: 0; margin-top: 8px; padding-top: 0; }
    .issue-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 22px;
      align-items: center;
      padding: 12px 14px;
      margin-bottom: 8px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #faf8f4;
    }
    .issue-row.open-issue {
      background: linear-gradient(135deg, #c6281c, #991b12);
      border-color: #6f100a;
      border-left: 8px solid #ffb4ab;
      color: #fff;
      box-shadow: 0 6px 18px rgba(180, 35, 24, 0.32);
    }
    .issue-row.open-issue a { color: #fff; font-weight: 700; }
    .issue-row.open-issue .issue-title { color: #ffe4de; }
    .issue-row.open-issue .badge.open { background: #fff; color: #b42318; font-weight: 750; }
    .issue-row.closed-issue {
      background: linear-gradient(135deg, #e7f6ee, #d7f0e2);
      border-color: #1f7a4d;
      border-left: 8px solid #1f7a4d;
      box-shadow: 0 4px 12px rgba(31, 122, 77, 0.18);
    }
    .issue-row.untracked-issue {
      background: linear-gradient(135deg, #fff3cd, #ffe08a);
      border-color: #c77d00;
      border-left: 8px solid #d97706;
      color: #713f12;
      box-shadow: 0 6px 18px rgba(217, 119, 6, 0.28);
      font-weight: 650;
    }
    .issue-row.untracked-issue .badge.unknown {
      background: #8a4b08;
      color: #fff;
      font-weight: 750;
    }
    .issue-row.healthy-run {
      background: linear-gradient(135deg, #e7f6ee, #d7f0e2);
      border-color: #1f7a4d;
      border-left: 8px solid #1f7a4d;
      color: #145c38;
      box-shadow: 0 4px 12px rgba(31, 122, 77, 0.16);
      font-size: 16px;
      font-weight: 750;
    }
    .healthy-icon {
      display: inline-grid;
      place-items: center;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #1f7a4d;
      color: #fff;
      font-size: 19px;
      line-height: 1;
      box-shadow: 0 3px 8px rgba(31, 122, 77, 0.28);
    }
    .healthy-copy { display: inline-flex; flex-direction: column; gap: 1px; }
    .healthy-copy small { color: #39785a; font-size: 12px; font-weight: 550; }
    .healthy-sparkle { margin-left: auto; font-size: 20px; }
    .issue-title { flex-basis: 100%; color: var(--muted); }
    .open-issues {
      margin-top: 18px;
      padding: 14px;
      border: 2px solid #e7b2ad;
      border-left: 6px solid var(--fail);
      border-radius: 12px;
      background: #fffafa;
      box-shadow: 0 4px 14px rgba(180, 35, 24, 0.10);
    }
    .open-issues h2 { font-size: 17px; margin: 0 0 10px; color: var(--fail); }
    table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 13px; }
    .open-issues th, .open-issues td { width: 33.333%; overflow-wrap: anywhere; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-size: 12px; font-weight: 650; }
    tr.open-row td { background: #fdecea; border-bottom-color: #efb4ae; }
    tr.open-row td:first-child { border-left: 5px solid var(--fail); }
    tr.open-row a { color: #9f1d14; font-weight: 700; }
    .badge {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      margin-right: 6px;
    }
    .badge.pass { background: #e7f6ee; color: var(--pass); }
    .badge.fail, .badge.open { background: #fff; color: var(--fail); font-weight: 700; }
    .badge.timeout { background: #fff6e0; color: var(--timeout); }
    .badge.closed { background: #e7f6ee; color: var(--pass); }
    .badge.unknown { background: #f3efe8; color: var(--muted); }
    h3 { margin: 14px 0 6px; font-size: 14px; }
    ul { margin: 0; padding-left: 18px; }
    li { margin: 8px 0; }
    code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
    .reason { white-space: pre-wrap; line-height: 1.55; }
    a { color: #1d4e89; }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header>
    <h1>msmodeling 流水日历</h1>
    <p class="lead">点一天查看当天本地 nightly：是否报错、报错原因、CI 没拦住的原因，以及跟踪 issue 是否闭环。时间按北京时间日志文件名。</p>
    <div id="freshness" class="freshness">正在检查数据新鲜度…</div>
  </header>
  <main>
    <section class="panel">
      <div class="cal-head">
        <button id="prev" type="button">上个月</button>
        <strong id="month-label"></strong>
        <button id="next" type="button">下个月</button>
      </div>
      <div id="summary" class="summary"></div>
      <div class="week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
      <div id="grid" class="grid"></div>
      <div class="legend">
        <span><i class="swatch" style="background:#1f7a4d"></i>通过</span>
        <span><i class="swatch" style="background:#b42318"></i>有失败</span>
        <span><i class="swatch" style="background:#9a6700"></i>超时</span>
        <span><i class="swatch" style="background:#d9d3ca"></i>无记录</span>
      </div>
      <div class="open-issues" id="open-issues">
        <h2>未闭环 Issue</h2>
        <div id="issue-sync-warning"></div>
        <div id="open-issue-table"><p class="meta">正在读取未闭环 issue…</p></div>
      </div>
    </section>
    <section class="panel" id="detail">
      <p class="meta">选择一天</p>
    </section>
  </main>
  <script src="config.js"></script>
  <script>
    const staticMode = window.NIGHTLY_BOARD_STATIC === true;
    const monthLabel = document.getElementById("month-label");
    const grid = document.getElementById("grid");
    const detail = document.getElementById("detail");
    const summary = document.getElementById("summary");
    let cursor = new Date();
    let selected = null;
    let today = "";

    function ymd(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function statusText(status) {
      if (status === "pass") return "通过";
      if (status === "fail") return "有失败";
      if (status === "timeout") return "超时";
      return "无记录";
    }

    async function renderFreshness() {
      const host = document.getElementById("freshness");
      if (!staticMode) {
        host.className = "freshness fresh";
        host.textContent = "● 实时模式：数据来自当前 Nightly 机器";
        return;
      }
      let exportedAt = window.NIGHTLY_BOARD_EXPORTED_AT || "";
      try {
        const response = await fetch(`data/manifest.json?t=${Date.now()}`, { cache: "no-store" });
        if (response.ok) exportedAt = (await response.json()).exported_at || exportedAt;
      } catch (_) {
        // Keep the config.js timestamp as a fallback when the manifest is unavailable.
      }
      const exported = new Date(exportedAt);
      const ageHours = (Date.now() - exported.getTime()) / 3600000;
      const stale = !Number.isFinite(ageHours) || ageHours > 24;
      host.className = `freshness ${stale ? "stale" : "fresh"}`;
      host.textContent = stale
        ? `⚠ 数据已超过 24 小时未更新（最后快照：${exportedAt || "未知"}）`
        : `● 数据已更新：${exportedAt}`;
    }

    function exitText(run) {
      if (run.exit_code === 0) return "通过";
      if (run.exit_code === 1) return "pytest 失败";
      if (run.exit_code === 3) return "归因需要跟进";
      if (run.exit_code === 124) return "超时";
      return `退出码 ${run.exit_code}`;
    }

    async function fetchMonth(year, month) {
      const key = `${year}-${String(month).padStart(2, "0")}`;
      const url = staticMode ? `data/month/${key}.json` : `/api/month?year=${year}&month=${month}`;
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok && staticMode) {
        return { today: window.NIGHTLY_BOARD_TODAY || ymd(new Date()), days: {} };
      }
      if (!response.ok) throw new Error(`读取月份失败：HTTP ${response.status}`);
      return response.json();
    }

    async function fetchDay(date) {
      const url = staticMode ? `data/day/${date}.json` : `/api/day?date=${date}`;
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok && staticMode) {
        return { date, today: window.NIGHTLY_BOARD_TODAY || ymd(new Date()), runs: [] };
      }
      if (!response.ok) throw new Error(`读取日期失败：HTTP ${response.status}`);
      return response.json();
    }

    async function loadMonth() {
      const year = cursor.getFullYear();
      const month = cursor.getMonth() + 1;
      monthLabel.textContent = `${year} 年 ${month} 月`;
      const payload = await fetchMonth(year, month);
      today = payload.today;
      const infos = Object.values(payload.days || {});
      summary.innerHTML = `
        <span><strong>${infos.reduce((sum, item) => sum + item.runs, 0)}</strong>本月运行</span>
        <span><strong>${infos.filter((item) => item.status === "fail").length}</strong>失败日</span>
        <span><strong>${infos.filter((item) => item.status === "timeout").length}</strong>超时日</span>
        <span><strong>${infos.length}</strong>有记录日</span>`;
      const first = new Date(year, month - 1, 1);
      const startOffset = (first.getDay() + 6) % 7;
      const daysInMonth = new Date(year, month, 0).getDate();
      grid.innerHTML = "";
      for (let i = 0; i < startOffset; i += 1) {
        const blank = document.createElement("div");
        blank.className = "day empty-cell";
        grid.appendChild(blank);
      }
      for (let day = 1; day <= daysInMonth; day += 1) {
        const date = `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
        const info = payload.days[date];
        const button = document.createElement("button");
        button.type = "button";
        button.dataset.date = date;
        button.className = `day ${info ? info.status : "none"}${date === selected ? " selected" : ""}${date === today ? " today" : ""}`;
        button.innerHTML = `<span class="num">${day}</span><span class="mark">${info ? statusText(info.status) : ""}</span>`;
        button.addEventListener("click", () => openDay(date));
        grid.appendChild(button);
      }
      if (!selected) openDay(today);
    }

    function failureItem(item) {
      const bits = [item.status, item.author, item.commit, item.subject].filter(Boolean).join(" · ");
      return `<li><code>${escapeHtml(item.node_id)}</code><div>${escapeHtml(bits)}</div><div class="reason">${escapeHtml(item.error)}</div></li>`;
    }

    function issueItem(issue) {
      const closed = issue.closed === true ? "已闭环" : issue.closed === false ? "未闭环" : "状态未知";
      const badge = issue.closed === true ? "closed" : issue.closed === false ? "open" : "unknown";
      const row = issue.closed === false ? "open-issue" : issue.closed === true ? "closed-issue" : "";
      const who = (issue.assignees || []).join(", ") || "未指定";
      return `<div class="issue-row ${row}">
        <span><strong>跟踪 Issue：</strong><a href="${escapeHtml(issue.html_url)}" target="_blank" rel="noreferrer">#${escapeHtml(issue.number)}</a></span>
        <span><strong>Issue 情况：</strong><span class="badge ${badge}">${closed}</span></span>
        <span><strong>责任人：</strong>${escapeHtml(who)}</span>
        <div class="issue-title">${escapeHtml(issue.title)}${issue.error ? `<div>${escapeHtml(issue.error)}</div>` : ""}</div>
      </div>`;
    }

    async function fetchOpenIssues() {
      const url = staticMode ? "data/open_issues.json" : "/api/open-issues";
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok && staticMode) return { issues: [] };
      if (!response.ok) throw new Error(`读取未闭环 issue 失败：HTTP ${response.status}`);
      return response.json();
    }

    function issueOpenDays(introduced, asOf) {
      const toUtcDay = (value) => {
        const match = String(value || "").match(/^(\d{4})-(\d{2})-(\d{2})/);
        return match ? Date.UTC(Number(match[1]), Number(match[2]) - 1, Number(match[3])) : NaN;
      };
      const started = toUtcDay(introduced);
      const current = toUtcDay(asOf);
      if (!Number.isFinite(started) || !Number.isFinite(current)) return "未知";
      return `已开启 ${Math.max(0, Math.floor((current - started) / 86400000))} 天`;
    }

    function renderOpenIssues(issues, asOf) {
      const host = document.getElementById("open-issue-table");
      if (!issues.length) {
        host.innerHTML = "<p>当前没有未闭环 issue。</p>";
        return;
      }
      const rows = issues.map((issue) => {
        const who = (issue.assignees || []).join(", ") || "未指定";
        const label = `#${issue.number}`;
        return `<tr class="open-row">
          <td><a href="${escapeHtml(issue.html_url)}" target="_blank" rel="noreferrer">${escapeHtml(label)}</a></td>
          <td>${escapeHtml(who)}</td>
          <td>${escapeHtml(issueOpenDays(issue.introduced, asOf))}</td>
        </tr>`;
      }).join("");
      host.innerHTML = `<table>
        <thead><tr><th>Issue 链接</th><th>责任人</th><th>已开启</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
    }

    async function loadOpenIssues() {
      try {
        const payload = await fetchOpenIssues();
        const warning = document.getElementById("issue-sync-warning");
        if (payload.sync_ok === false) {
          warning.className = "sync-warning";
          warning.textContent = `⚠ Issue 状态同步失败 ${payload.sync_errors?.length || 0} 项，不能将空表解读为全部闭环。`;
        } else {
          warning.className = "";
          warning.textContent = "";
        }
        renderOpenIssues(payload.issues || [], payload.today || window.NIGHTLY_BOARD_TODAY || ymd(new Date()));
      } catch (error) {
        document.getElementById("open-issue-table").innerHTML = `<p>${escapeHtml(error.message)}</p>`;
      }
    }

    function runBlock(run) {
      const badge = run.exit_code === 0 ? "pass" : run.exit_code === 124 ? "timeout" : "fail";
      const healthy = run.exit_code === 0;
      const coverage = run.coverage
        ? `覆盖率 line ${run.coverage.line}% / branch ${run.coverage.branch}%（${run.coverage.gate === "passed" ? "门禁通过" : "门禁未过"}）`
        : "日志里没有覆盖率门禁行";
      const failures = healthy
        ? ""
        : run.failures.length
          ? `<h3>报错原因</h3><ul>${run.failures.map(failureItem).join("")}</ul>`
          : "<h3>报错原因</h3><p>没有 Failed 归因行。</p>";
      const ci = healthy
        ? ""
        : run.ci_miss_reason
          ? `<h3>CI 没报错的原因</h3><p class="reason">${escapeHtml(run.ci_miss_reason)}</p>`
          : "<h3>CI 没报错的原因</h3><p>这次没有单独记录 CI 未报错的原因。PR UT 默认排除 nightly / npu / network；只有核对过的日期会写明具体原因。</p>";
      const issues = run.issues.length
        ? run.issues.map(issueItem).join("")
        : run.exit_code === 0
          ? `<div class="issue-row healthy-run"><span class="healthy-icon" aria-hidden="true">✓</span><span class="healthy-copy"><span>今日无问题</span><small>Nightly 流水运行正常</small></span><span class="healthy-sparkle" aria-hidden="true">✨</span></div>`
          : `<div class="issue-row untracked-issue"><span><strong>跟踪 Issue：</strong>未建</span><span><strong>Issue 情况：</strong><span class="badge unknown">未跟踪</span></span><span><strong>责任人：</strong>未指定</span></div>`;
      return `
        <article class="run">
          ${issues}
          <div><span class="badge ${badge}">${exitText(run)}</span> ${escapeHtml(run.branch)} ${run.label === run.branch ? "" : escapeHtml(run.label)}</div>
          <p class="meta">${escapeHtml(run.started)} ${run.commit ? `· ${escapeHtml(run.commit)}` : ""} · passed ${run.passed} / failed ${run.failed} / errors ${run.errors} · pytest ${run.duration_sec}s</p>
          <p class="meta">${coverage}</p>
          <p class="meta"><code>${escapeHtml(run.log)}</code></p>
          ${failures}
          ${ci}
        </article>`;
    }

    async function openDay(date) {
      selected = date;
      grid.querySelectorAll(".day[data-date]").forEach((button) => {
        button.classList.toggle("selected", button.dataset.date === date);
      });
      detail.innerHTML = "<p class='meta'>正在读取日志和 issue 状态…</p>";
      const payload = await fetchDay(date);
      const title = date === payload.today ? `${date} · 今天` : date;
      if (!payload.runs.length) {
        const emptyText = date === payload.today
          ? "⚪ 今日暂无流水记录（可能未运行或尚未同步）。"
          : "这一天没有带 Nightly exit 的本地流水日志。";
        detail.innerHTML = `<div class="detail-head"><h2>${title}</h2></div><p>${emptyText}</p>`;
        return;
      }
      const action = staticMode ? `<span class="meta">静态快照：${window.NIGHTLY_BOARD_EXPORTED_AT || ""}</span>` : `<button id="reload" type="button">刷新 issue</button>`;
      detail.innerHTML = `<div class="detail-head"><h2>${title}</h2>${action}</div>${payload.runs.map(runBlock).join("")}`;
      if (!staticMode) document.getElementById("reload").addEventListener("click", () => openDay(date));
    }

    document.getElementById("prev").addEventListener("click", () => {
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() - 1, 1);
      selected = null;
      loadMonth();
    });
    document.getElementById("next").addEventListener("click", () => {
      cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
      selected = null;
      loadMonth();
    });
    cursor = new Date();
    renderFreshness();
    loadMonth();
    loadOpenIssues();
    setInterval(() => {
      renderFreshness();
      loadMonth();
      loadOpenIssues();
      if (selected) openDay(selected);
    }, 300000);
  </script>
</body>
</html>
