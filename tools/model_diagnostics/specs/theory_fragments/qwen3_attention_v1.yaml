fragment_id: qwen3_attention_v1
fragment_kind: model_decoder
# Shared Qwen3 full-attention stages. Dense and MoE decoders include this pack.
stages:
  - id: attention_qkv
    modules:
      - name: q_projection
        tensors:
          INPUT[0]: {shape: "[T, H]", dtype: LINEAR_IN}
          OUTPUT[0]: {shape: "[T, Lh * QH]", dtype: OUT}
      - name: k_projection
        tensors:
          INPUT[0]: {shape: "[T, H]", dtype: LINEAR_IN}
          OUTPUT[0]: {shape: "[T, Lkv * Dh]", dtype: OUT}
      - name: v_projection
        tensors:
          INPUT[0]: {shape: "[T, H]", dtype: LINEAR_IN}
          OUTPUT[0]: {shape: "[T, Lkv * Dh]", dtype: OUT}
    runtime:
      boundary_operators:
        - rms_norm
        - rms_norm_dynamic_quant_symmetric
        - rms_norm_quant
      ignored_operators:
        - rms_norm
        - rms_norm_dynamic_quant_symmetric
        - rms_norm_quant
        - view
        - index
        - reshape_and_cache
        - split_with_sizes
        - alias
        - copy_
        - slice
        - select
        - apply_rope
        - permute
        - dynamic_quantize_symmetric
    comparisons:
      theory-runtime:
        strategy: concat_shape
  - id: attention
    modules:
      - name: attention
        tensors:
          INPUT[0]: {shape: "[T, Lh * Dh]", dtype: ACT}
          INPUT[1]: {shape: "[Nblk, Bs, Lkv, Dh]", dtype: ACT}
          INPUT[2]: {shape: "[Nblk, Bs, Lkv, Dh]", dtype: ACT}
          OUTPUT[0]: {shape: "[T, Lh * Dh]", dtype: OUT}
      - name: o_projection
        tensors:
          INPUT[0]: {shape: "[T, Lh * Dh]", dtype: LINEAR_IN}
          OUTPUT[0]: {shape: "[T, H]", dtype: OUT}
    runtime:
      boundary_operators: [attention]
      ignored_operators:
        - view
        - index
        - reshape_and_cache
        - split_with_sizes
        - alias
        - copy_
        - slice
        - select
        - apply_rope
        - dynamic_quantize_symmetric
        - quantize
        # TP>1: o_projection all_reduce collapses TP partials on token dim.
        - all_reduce
